[build-system]
requires = ["maturin>=1.15.0,<2"]
build-backend = "maturin"

[project]
name = "contourrs"
version = "0.8.1"
readme = "README.md"
description = "Fast raster polygonization with Arrow export — pure Rust, zero GDAL"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=2.5.3,<3", "pyarrow>=25.0.1,<26"]

[project.optional-dependencies]
test = ["rasterio>=1.5.1,<2", "shapely>=2.1.2,<3", "pytest>=9.1.1,<10"]
examples = ["contourrs[docs]", "torchgeo>=0.10.0,<0.11"]
docs = [
    "rasterio>=1.5.1,<2", "shapely>=2.1.2,<3", "matplotlib>=3.11.2,<4",
    "geopandas>=1.1.4,<2", "ipykernel>=7.3.0,<8", "nbconvert>=7.17.1,<8",
    "zensical>=0.0.65,<0.1",
]
dev = [
    "contourrs[test,docs]", "maturin>=1.15.0,<2", "pre-commit>=4.6.2,<5",
    "ruff>=0.16.8,<0.17", "ty>=0.0.84,<0.1", "pyrefly>=1.3.1,<2", "psutil>=7.2.2,<8",
]
all = ["contourrs[dev,examples]"]

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "crates/contourrs-python/Cargo.toml"
python-source = "python"
module-name = "contourrs._contourrs"

[tool.pytest.ini_options]
markers = ["integration: requires rasterio + shapely"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY",     # no repository-wide copyright-header requirement
    "D",       # pydocstyle — too noisy for small project
    "ANN",     # type annotations — covered by ty
    "ERA",     # commented-out code
    "T20",     # print statements (used in notebooks/tests)
    "S101",    # assert in tests
    "INP001",  # implicit namespace packages
    "PTH",     # pathlib preference — not always cleaner
    "FBT",     # boolean positional args
    "PLR0913", # too many arguments
    "COM812",  # trailing comma (conflicts with formatter)
    "ISC001",  # implicit string concat (conflicts with formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "PT018", "BLE001", "PLR1722", "PLC0415"]
"examples/*" = ["T20", "E402", "F811", "PLR2004", "ICN001", "PLC0415"]
"scripts/*" = ["T20", "ICN001", "E402", "PLC0415"]
"*.pyi" = ["PYI021", "PYI048", "PYI044", "PYI002", "PIE790", "UP045", "ICN001"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty.src]
exclude = ["tests/", "examples/torchgeo_ftw_polygonize.ipynb"]

[tool.pyrefly]
search-path = ["python"]
project-includes = ["python/**/*.py", "python/**/*.pyi"]
python-version = "3.12"
