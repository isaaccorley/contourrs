name: docs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Build and install contourrs
        run: uv sync --locked --python 3.13 --extra docs

      - name: Build notebook tutorials
        run: bash scripts/build_tutorials.sh

      - run: uv run --locked --extra docs zensical build --clean
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
