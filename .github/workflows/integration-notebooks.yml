name: Integration Notebooks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  notebooks:
    name: Run integration notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Build and install
        run: uv sync --locked --python 3.13 --extra docs

      - name: Execute and convert notebooks
        run: bash scripts/build_tutorials.sh /tmp/tutorial-notebooks
