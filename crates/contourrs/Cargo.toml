[package]
name = "contourrs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure Rust raster polygonization — contourrs core"

[features]
default = []
arrow = ["dep:arrow"]

[dependencies]
arrow = { version = "60.0.0", optional = true, default-features = false, features = ["ffi"] }
geo-types = "0.7.20"
rayon = "1.12.0"
rustc-hash = "2.1.3"
rstar = "0.12.2"

geo = "0.33.1"
