repos:
  # Rust formatting + linting
  - repo: https://github.com/AndrejOrsula/pre-commit-cargo
    rev: 0.5.0
    hooks:
      - id: cargo-fmt
        args: ["--all", "--", "--check"]
      - id: cargo-clippy
        args: ["--workspace", "--features", "contourrs/arrow", "--", "-D", "warnings"]
      - id: cargo-check
        args: ["--workspace", "--features", "contourrs/arrow"]
      - id: cargo-test
        args: ["--workspace"]

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
        # Dense generated figures retain 300-dpi rasters and vector labels.
        exclude: ^(docs/)?assets/(cdl_polygonize|contours_mt_rainier)\.(png|svg|pdf)$

  # Python linting + formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Python type checking
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run --locked --extra dev ty check --exclude tests/
        language: system
        pass_filenames: false
        always_run: true
      - id: pyrefly
        name: pyrefly check
        entry: uv run --locked --extra dev pyrefly check
        language: system
        pass_filenames: false
        always_run: true
